workflows:
  android-release:
    name: RMS Communications Android Release
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - rms_app
      vars:
        PACKAGE_NAME: "com.rmscommunications.easy_payments"
    scripts:
      - name: Prepare Android project
        script: |
          flutter create --platforms=android --org com.rmscommunications .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest ', 1)
              idx = s.find('>')
              s = s[:idx+1] + '\n    ' + perm + s[idx+1:]
              p.write_text(s)
          PY
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
